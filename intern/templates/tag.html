<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tag chords &mdash; {{ song.song }}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    a.back { font-size: 0.9rem; }
    .muted { color: #666; font-size: 0.85rem; }
    #stage { position: relative; display: inline-block; touch-action: none; user-select: none; margin-top: 1rem; }
    #stage img { display: block; max-width: 100%; height: auto; }
    .box { position: absolute; border: 2px solid #d33; background: rgba(221, 51, 51, 0.08); box-sizing: border-box; }
    .box .tag-label { position: absolute; top: -1.2rem; left: -2px; background: #d33; color: #fff; font-size: 0.7rem; padding: 1px 4px; border-radius: 2px; white-space: nowrap; }
    .box .tag-remove { position: absolute; top: -1.2rem; right: -2px; background: #d33; color: #fff; font-size: 0.7rem; padding: 1px 4px; border-radius: 2px; cursor: pointer; }
    #picker { position: absolute; display: none; background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 0.4rem; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); z-index: 10; }
    #picker input { font-size: 0.9rem; padding: 0.3rem; width: 140px; }
    .taglist { margin-top: 1rem; font-size: 0.9rem; }
    button.primary { margin-top: 1rem; padding: 0.6rem 1.2rem; font-size: 1rem; }
  </style>
</head>
<body>
  <p><a class="back" href="/songs">&larr; Songs</a></p>
  <h1>Tag chords &mdash; {{ song.song }}</h1>
  <p class="muted">Drag a box around each chord, then type its name and press Enter. Click &times; on a box to remove it.</p>

  <div id="stage">
    <img id="song-img" src="/songs/{{ slug }}/image/original" alt="{{ song.song }}" />
    <div id="picker">
      <input list="chord-names" id="picker-input" placeholder="e.g. Bm7 or B7/D#" autocomplete="off" />
    </div>
  </div>
  <datalist id="chord-names">
    {% for name in chord_names %}<option value="{{ name }}">{% endfor %}
  </datalist>

  <ul class="taglist" id="taglist"></ul>
  <button class="primary" id="save-btn">Save tags</button>

  <script>
    const slug = {{ slug|tojson }};
    const stage = document.getElementById('stage');
    const img = document.getElementById('song-img');
    const picker = document.getElementById('picker');
    const pickerInput = document.getElementById('picker-input');
    const taglist = document.getElementById('taglist');
    let tags = {{ tags_json|safe }};
    let dragBox = null;
    let dragStart = null;
    let pendingRect = null;

    const scale = () => img.naturalWidth / img.clientWidth;

    function renderTags() {
      stage.querySelectorAll('.box').forEach(b => b.remove());
      taglist.innerHTML = '';
      const s = 1 / scale();
      tags.forEach((t, i) => {
        const box = document.createElement('div');
        box.className = 'box';
        Object.assign(box.style, {
          left: (t.x * s) + 'px', top: (t.y * s) + 'px',
          width: (t.w * s) + 'px', height: (t.h * s) + 'px',
        });

        const label = document.createElement('span');
        label.className = 'tag-label';
        label.textContent = t.chord;
        box.appendChild(label);

        const remove = document.createElement('span');
        remove.className = 'tag-remove';
        remove.textContent = '×';
        remove.addEventListener('click', () => { tags.splice(i, 1); renderTags(); });
        box.appendChild(remove);

        stage.appendChild(box);

        const li = document.createElement('li');
        li.textContent = t.chord;
        taglist.appendChild(li);
      });
    }

    function stagePoint(evt) {
      const rect = stage.getBoundingClientRect();
      const point = evt.touches ? evt.touches[0] : evt;
      return { x: point.clientX - rect.left, y: point.clientY - rect.top };
    }

    function start(evt) {
      if (evt.target.closest('.box') || evt.target.closest('#picker')) return;
      evt.preventDefault();
      dragStart = stagePoint(evt);
      dragBox = document.createElement('div');
      dragBox.className = 'box';
      dragBox.style.borderStyle = 'dashed';
      stage.appendChild(dragBox);
    }

    function move(evt) {
      if (!dragBox) return;
      evt.preventDefault();
      const p = stagePoint(evt);
      const x = Math.min(p.x, dragStart.x), y = Math.min(p.y, dragStart.y);
      const w = Math.abs(p.x - dragStart.x), h = Math.abs(p.y - dragStart.y);
      Object.assign(dragBox.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      pendingRect = { x, y, w, h };
    }

    function end(evt) {
      if (!dragBox) return;
      evt.preventDefault();
      dragBox.remove();
      dragBox = null;
      if (!pendingRect || pendingRect.w < 6 || pendingRect.h < 6) { pendingRect = null; return; }
      picker.style.left = pendingRect.x + 'px';
      picker.style.top = (pendingRect.y + pendingRect.h + 4) + 'px';
      picker.style.display = 'block';
      picker.dataset.rect = JSON.stringify(pendingRect);
      pickerInput.value = '';
      pickerInput.focus();
    }

    stage.addEventListener('mousedown', start);
    stage.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    stage.addEventListener('touchstart', start, { passive: false });
    stage.addEventListener('touchmove', move, { passive: false });
    stage.addEventListener('touchend', end);

    function confirmPicker() {
      if (picker.style.display === 'none') return;
      const name = pickerInput.value.trim();
      const rect = picker.dataset.rect;
      picker.style.display = 'none';
      if (!name || !rect) return;
      const r = JSON.parse(rect);
      const s = scale();
      tags.push({
        chord: name,
        x: Math.round(r.x * s), y: Math.round(r.y * s),
        w: Math.round(r.w * s), h: Math.round(r.h * s),
      });
      renderTags();
    }

    pickerInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); confirmPicker(); }
      if (e.key === 'Escape') { picker.style.display = 'none'; }
    });
    pickerInput.addEventListener('blur', () => setTimeout(confirmPicker, 150));

    document.getElementById('save-btn').addEventListener('click', async () => {
      const resp = await fetch(`/songs/${slug}/tag`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chords: tags }),
      });
      if (resp.ok) {
        window.location.href = '/songs';
      } else {
        alert('Failed to save tags: ' + await resp.text());
      }
    });

    if (img.complete) renderTags(); else img.addEventListener('load', renderTags);
  </script>
</body>
</html>
