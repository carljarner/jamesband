{% extends "base.html" %}
{% block title %}Scan cleanup{% endblock %}
{% block content %}
<p><a class="back" href="/">&larr; Intern tools</a></p>
<h1>Scan cleanup</h1>
<p class="muted">Photo of a handwritten pencil chart in, clean print-ready PDF out.</p>

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="post" action="/scan/clean" enctype="multipart/form-data" id="scan-form">
  <input type="file" name="photo" accept="image/*" capture="environment" required id="photo-input" />
  <img id="preview" alt="Preview" />
  <button class="primary" type="submit" id="submit-btn">Clean up &amp; download PDF</button>
</form>
{% endblock %}

{% block scripts %}
<script>
  const input = document.getElementById('photo-input');
  const preview = document.getElementById('preview');
  const form = document.getElementById('scan-form');
  const submitBtn = document.getElementById('submit-btn');

  input.addEventListener('change', () => {
    const file = input.files[0];
    if (!file) {
      preview.style.display = 'none';
      return;
    }
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  });

  form.addEventListener('submit', () => {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Cleaning up…';
    setTimeout(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Clean up & download PDF';
    }, 15000); // safety reset in case the download doesn't navigate away
  });
</script>
{% endblock %}
