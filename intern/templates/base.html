<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Intern tools{% endblock %} &middot; James Band</title>
  <link rel="icon" href="/static/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/style.css" />
  {% block extra_style %}{% endblock %}
</head>
<body>
  {% block topbar %}
  <header class="topbar">
    <a href="/" class="topbar__brand">
      <img src="/static/logo.png" alt="James Band" class="topbar__logo" />
      JAMES BAND &middot; INTERN
    </a>
  </header>
  {% endblock %}
  <main class="container {% block container_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
