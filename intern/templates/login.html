<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intern login</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    form { display: flex; flex-direction: column; gap: 0.75rem; width: 240px; }
    input, button { font-size: 1rem; padding: 0.5rem; }
    .error { color: #c00; font-size: 0.9rem; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Band intern page</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <input type="password" name="password" placeholder="Password" autofocus required />
    <button type="submit">Log in</button>
  </form>
</body>
</html>
